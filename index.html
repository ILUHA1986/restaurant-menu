<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Digital restaurant menu">
  <meta name="theme-color" content="#171717">
  <title>Restaurant Menu</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="site-header"></header>
    <main>
      <section id="toolbar" class="toolbar"></section>
      <nav id="category-nav" class="category-nav" aria-label="Menu categories"></nav>
      <section id="menu" class="menu-content" aria-live="polite"></section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
